[project]
name = "aihax-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "anthropic>=0.25.0",
    "apscheduler>=3.10.0",
    "chromadb>=0.4.0",
    "cryptography>=42.0.0",
    "dnspython>=2.6.0",
    "fastapi>=0.110.0",
    "fpdf2>=2.7.0",
    "jinja2>=3.1.0",
    "playwright>=1.43.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "shodan>=1.31.0",
    "sqlalchemy>=2.0.0",
    "stripe>=5.0.0",
    "twilio>=9.0.0",
    "uvicorn[standard]>=0.27.0",
    "weasyprint>=60.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
